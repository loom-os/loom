name = "chat-agent"
description = "Interactive chat agent with cognitive loop and tool use"
version = "0.1.0"

[bridge]
address = "127.0.0.1:50051"
mode = "full"

[dashboard]
enabled = false

[agents.chat-assistant]
topics = ["chat.input", "chat.replies"]
llm_provider = "deepseek"
thinking_strategy = "react"
max_iterations = 20

# Tools available in Rust Core (core/src/tools/native/)
# These are the exact tool names registered in the runtime
tools = [
    "fs:read_file",
    "fs:write_file",
    "fs:list_dir",
    "shell:run",
    "weather:get",
    "web:search",
    "git:status",
    "git:diff",
]

[llm.deepseek]
type = "http"
api_key = "${DEEPSEEK_API_KEY}"
api_base = "https://api.deepseek.com/v1"
model = "deepseek-chat"
max_tokens = 4096
temperature = 0.7
timeout_sec = 60

[llm.local]
type = "http"
api_base = "http://localhost:8000/v1"
model = "qwen2.5-7b-instruct"
max_tokens = 2048
temperature = 0.8
timeout_sec = 30
